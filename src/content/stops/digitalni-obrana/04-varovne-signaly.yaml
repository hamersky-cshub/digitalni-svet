# Zastávka workshopu. Každá položka v "screens" je jedna obrazovka (krok).
# Popis polí a typů aktivit najdete v README.md (sekce Úprava obsahu).

workshop: digitalni-obrana
order: 4
title: Najděte varovné signály
summary: Varovné signály ve zprávách i v adresách – a jak poznat zprávu, která je v pořádku.
lecturer:
  time: 25 minut
  goal: Účastníci poznají typické varovné signály. Zdůrazněte, že podvod může vypadat bezchybně – pravopis nic nezaručuje.
  discussion: Který signál byste nejspíš přehlédli?
  transition: Podvody nepřicházejí jen písemně. Co když zavolá „banka“?
screens:
  - kind: vyklad
    title: Za koho se podvodníci vydávají
    text:
      - 'Podvodníci se nejčastěji vydávají za firmy, které zná každý. Zpráva pak vypadá důvěryhodně:'
    points:
      - 📦 **Doručovací služby** – „zásilka čeká na doplatek“.
      - 💻 **Technologické firmy** – „váš účet bude zablokován“.
      - 👥 **Sociální sítě a chaty** – „máte novou zprávu“.
      - 🏦 **Banky a úřady** – „ověřte svou totožnost“.
      - 'Často se opakují slova: **faktura, nová zpráva, ověření, dokument, žádost, akce**.'
    lecturer:
      tips:
        - 'Nejčastěji napodobované značky podle podkladů: LinkedIn, Facebook, Google, DHL, Microsoft, WhatsApp, Amazon, Apple (Hoxhunt Phishing Trends Report 2025, VIPRE 2024).'
  - kind: aktivita
    title: Podezřelá SMS
    activity:
      type: signals
      instruction: Klepněte na podtržené části zprávy, které vám připadají podezřelé.
      medium: sms
      sender: '[[+44 7700 900 123|cislo]]'
      time: '7:12'
      body:
        - Dobrý den, [[vaše zásilka|obecne]] nemohla být doručena kvůli neúplné adrese.
        - '[[Do 12 hodin|nalehavost]] prosím doplňte adresu a [[uhraďte poplatek 39 Kč|penize]]:'
        - '[[{{dorucovaci-sluzba.zasilky-cz.test/adresa}}|odkaz]]'
      signals:
        cislo:
          label: Neznámé zahraniční číslo
          text: 'Zpráva přišla ze zahraničního čísla, i když jde o „českou“ zásilku. Pozor: podvodníci umějí zobrazit i důvěryhodně vypadajícího odesílatele.'
        obecne:
          label: Obecné oslovení
          text: Zpráva neuvádí vaše jméno, číslo zásilky ani název firmy. Stejná zpráva totiž odešla tisícům lidí.
        nalehavost:
          label: Časový tlak
          text: Krátká lhůta má zabránit tomu, abyste si to v klidu promysleli nebo se někoho zeptali.
        penize:
          label: Požadavek na peníze
          text: Malý poplatek nevypadá podezřele. Na falešné stránce byste ale zadali údaje z platební karty.
        odkaz:
          label: Podivná adresa odkazu
          text: Adresa jen připomíná doručovací službu, ale patří někomu jinému. Podvodné adresy často obsahují známé slovo doplněné dalšími částmi. Na odkazy v nečekaných zprávách raději neklepejte.
      note: Tato SMS je napsaná bez chyb. Podvodné zprávy dnes často vypadají profesionálně, proto pravopis nic nezaručuje. Důležitější je, **co po vás zpráva chce**.
  - kind: aktivita
    title: Podezřelý e-mail
    activity:
      type: signals
      instruction: Klepněte na podtržené části e-mailu, které vám připadají podezřelé.
      medium: email
      sender: Zákaznická podpora <[[podpora@vase-banka.bezpecnost-overeni.test|adresa]]>
      subject: '[[Okamžitá akce nutná: váš účet byl omezen|predmet]]'
      body:
        - '[[Vážený kliente,|osloveni]]'
        - z bezpečnostních důvodů jsme dočasně omezili přístup k vašemu účtu.
        - Pro obnovení přístupu prosím v přiloženém formuláři [[potvrďte své přihlašovací jméno a heslo|heslo]] [[do 24 hodin, jinak bude účet trvale zrušen|hrozba]].
        - Děkujeme za pochopení. Váš tým zákaznické podpory
      attachment: '[[Formular_overeni.html|priloha]]'
      signals:
        adresa:
          label: Podivná adresa odesílatele
          text: Jméno odesílatele vypadá důvěryhodně, ale skutečná adresa za ním je dlouhá a zvláštní. Na tabletu ji často uvidíte až po klepnutí na jméno.
        predmet:
          label: Naléhavý předmět
          text: „Okamžitá akce nutná“ – cílem je vyvolat strach a spěch.
        osloveni:
          label: Neosobní oslovení
          text: Vaše banka vás obvykle oslovuje jménem. Ani oslovení jménem ale není záruka – podvodníci ho mohou znát.
        heslo:
          label: Žádost o heslo
          text: Žádná banka ani jiná služba po vás nikdy nebude chtít heslo e-mailem, zprávou nebo po telefonu.
        hrozba:
          label: Výhrůžka a krátká lhůta
          text: Hrozba zrušením účtu má vyvolat strach, abyste jednali hned a nepřemýšleli.
        priloha:
          label: Nečekaná příloha
          text: Nečekané přílohy neotevírejte. Mohou obsahovat falešný formulář nebo škodlivý program.
      note: 'I tento e-mail je napsaný bez chyb. Zaměřte se na to, **co po vás zpráva chce**: heslo, peníze, kód nebo klepnutí na odkaz jsou vždy důvod zpozornět.'
  - kind: aktivita
    title: Která adresa je pravá?
    text:
      - Podvodníci si registrují adresy, které se od skutečných liší jen nepatrně. Písmeno navíc nebo „rn“ místo „m“ se snadno přehlédne.
      - Představte si, že vaše banka se jmenuje **Modrá banka** a její skutečná adresa je **modrabanka.test**. Rozhoduje, čím adresa končí před prvním lomítkem „/“. Některé adresy jsou pravé, jiné podvržené.
    activity:
      type: scenarios
      itemLabel: Adresa
      items:
        - text: 'Přišel e-mail s odkazem na adresu: {{modrabanka.test}}'
          question: Je to adresa vaší banky?
          options:
            - label: Ano, je pravá
              tone: ok
              feedback: Ano, přesně odpovídá skutečné adrese. Přesto je bezpečnější psát adresu banky sami než klepat na odkaz.
            - label: Ne, je podvržená
              tone: info
              feedback: Tentokrát je adresa pravá – shoduje se písmeno po písmenu. Opatrnost je ale na místě vždy.
        - text: 'Přišel e-mail s odkazem na adresu: {{rnodrabanka.test}}'
          question: Je to adresa vaší banky?
          options:
            - label: Ano, je pravá
              tone: risk
              feedback: 'Podívejte se pozorně na začátek: místo „m“ jsou tam dvě písmena „r“ a „n“. Na malém displeji vypadají skoro stejně.'
            - label: Ne, je podvržená
              tone: ok
              feedback: Správně. Místo „m“ jsou na začátku písmena „r“ a „n“.
        - text: 'Přišel e-mail s odkazem na adresu: {{ib.modrabanka.test}}'
          question: Je to adresa vaší banky?
          options:
            - label: Ano, je pravá
              tone: ok
              feedback: Ano. Adresa končí „modrabanka.test“ a část „ib.“ na začátku patří bance – takhle mívají banky adresu internetového bankovnictví.
            - label: Ne, je podvržená
              tone: info
              feedback: Tentokrát je pravá. Rozhoduje konec adresy – „modrabanka.test“. Část „ib.“ (internetové bankovnictví) před ním si může nastavit jen sama banka.
        - text: 'Přišel e-mail s odkazem na adresu: {{modrabankka.test}}'
          question: Je to adresa vaší banky?
          options:
            - label: Ano, je pravá
              tone: risk
              feedback: 'V adrese je zdvojené „k“: „bankka“. Jediné písmeno navíc znamená úplně jinou adresu.'
            - label: Ne, je podvržená
              tone: ok
              feedback: Správně. Zdvojené „k“ z adresy dělá jinou adresu, která bance nepatří.
        - text: 'Přišel e-mail s odkazem na adresu: {{modrabanka-overeni.test}}'
          question: Je to adresa vaší banky?
          options:
            - label: Ano, je pravá
              tone: risk
              feedback: Slovo navíc („-overeni“) vytváří úplně jinou adresu. Patří někomu jinému než bance.
            - label: Ne, je podvržená
              tone: ok
              feedback: Správně. I slovo, které zní důvěryhodně, z adresy dělá jinou adresu.
        - text: 'Přišel e-mail s odkazem na adresu: {{modrabanka.test/kontakty}}'
          question: Je to adresa vaší banky?
          options:
            - label: Ano, je pravá
              tone: ok
              feedback: Ano. Před lomítkem je přesně „modrabanka.test“. Část za lomítkem jen ukazuje konkrétní stránku na webu banky.
            - label: Ne, je podvržená
              tone: info
              feedback: Tentokrát je pravá. Za lomítkem „/“ je jen název stránky – důležité je, že před ním stojí přesně „modrabanka.test“.
        - text: 'Přišel e-mail s odkazem na adresu: {{modra-banka.test}}'
          question: Je to adresa vaší banky?
          options:
            - label: Ano, je pravá
              tone: risk
              feedback: Pomlčka uprostřed z adresy dělá jinou adresu. „modra-banka.test“ může patřit komukoli.
            - label: Ne, je podvržená
              tone: ok
              feedback: Správně. I jediná pomlčka navíc znamená jinou adresu.
        - text: 'Přišel e-mail s odkazem na adresu: {{modrabanka.test.prihlaseni-klient.test}}'
          question: Je to adresa vaší banky?
          options:
            - label: Ano, je pravá
              tone: risk
              feedback: Rozhoduje konec adresy. Tato končí „prihlaseni-klient.test“ – název banky na začátku je jen převlek.
            - label: Ne, je podvržená
              tone: ok
              feedback: Správně. Rozhoduje konec adresy, ne to, co je na začátku.
          lesson: Nejjistější je adresu banky psát sami nebo použít její aplikaci – ne klepat na odkazy ve zprávách.
    lecturer:
      tips:
        - Tři adresy jsou pravé (modrabanka.test, ib.modrabanka.test a modrabanka.test/kontakty), pět je podvržených. Cílem není strach z každé adresy, ale návyk podívat se na konec adresy před prvním lomítkem.
  - kind: shrnuti
    title: Tři otázky ke každé zprávě
    activity:
      type: rules
      items:
        - title: Co po mně zpráva chce?
          text: Peníze, heslo, kód nebo klepnutí na odkaz jsou vždy důvod zpozornět.
        - title: Spěchá na mě?
          text: Naléhavost je jeden z nejčastějších triků.
        - title: Čekal(a) jsem ji?
          text: Nečekanou zprávu si ověřte jinou cestou.
  - kind: aktivita
    title: Podvod, nebo ne?
    text:
      - Vyzkoušejte si tři otázky na dvanácti zprávách. Některé jsou podvodné, jiné úplně v pořádku. Když si nejste jistí, je to v pořádku – stačí si zprávu ověřit jinou cestou.
    activity:
      type: choices
      itemLabel: Zpráva
      question: Je tato zpráva podvodná?
      options:
        - id: podvod
          label: Podvod
        - id: v-poradku
          label: V pořádku
        - id: overim
          label: Nejsem si jistý/á – ověřím si to
      items:
        - message:
            medium: sms
            sender: Lékárna U Lípy
            time: '10:15'
            lines:
              - Dobrý den, váš lék je připraven k vyzvednutí. Těšíme se na vás. Lékárna U Lípy
          recommended:
            - v-poradku
            - overim
          explanation: 'Nejspíš v pořádku. Zpráva po vás nic nechce – žádný odkaz, peníze ani údaje. Pokud jste lék objednávali, je to obyčejné upozornění.'
        - message:
            medium: sms
            sender: Neznámé číslo
            time: '8:02'
            lines:
              - 'Vaše zásilka čeká na doplacení cla 52 Kč. Jinak bude vrácena odesílateli: {{celni-platby.zasilky-cz.test}}'
          recommended:
            - podvod
            - overim
          avoid:
            - v-poradku
          explanation: '**Podvod.** Malý poplatek, krátká lhůta a odkaz na podivnou adresu. Clo se neplatí přes odkaz v SMS od neznámého čísla.'
        - message:
            medium: sms
            sender: Modrá banka
            time: '12:40'
            lines:
              - Platba kartou 349 Kč v obchodě Potraviny Novák byla provedena. Modrá banka
          recommended:
            - v-poradku
            - overim
          explanation: 'Pokud jste právě nakupovali, je to běžné **upozornění na platbu**. Zpráva nic nechce. Kdybyste ale platbu neprovedli, zavolejte bance na číslo z platební karty – ne na číslo ze zprávy.'
        - message:
            medium: email
            sender: Výherní oddělení <vyhry@super-losovani.test>
            subject: Gratulujeme, vyhráli jste!
            lines:
              - Byli jste vylosováni jako výherce nového telefonu. Pro převzetí výhry vyplňte své údaje a číslo karty do 2 hodin.
          recommended:
            - podvod
            - overim
          avoid:
            - v-poradku
          explanation: '**Podvod.** Výhra v soutěži, do které jste se nepřihlásili, a k tomu číslo karty a krátká lhůta. Skutečná výhra nikdy nevyžaduje údaje z platební karty.'
        - message:
            medium: chat
            sender: Dcera Jana
            time: '19:20'
            lines:
              - Mami, v neděli přijedeme na oběd kolem dvanácté, jestli to platí 🙂
          recommended:
            - v-poradku
            - overim
          explanation: '**V pořádku.** Zpráva přišla od uloženého kontaktu, který znáte, a nic po vás nechce. Takové zprávy jsou většina toho, co dostáváme.'
        - message:
            medium: chat
            sender: Neznámé číslo
            time: '21:03'
            lines:
              - Ahoj, tady Petra, mám nové číslo. Omylem jsem ti poslala SMS s kódem. Můžeš mi ho prosím přeposlat?
          recommended:
            - podvod
            - overim
          avoid:
            - v-poradku
          explanation: '**Podvod.** Kód z SMS je klíč k vašemu účtu – třeba k chatu. Kdo ho získá, může váš účet ovládnout a psát vaším jménem dalším lidem. Kód nikomu neposílejte.'
        - message:
            medium: sms
            sender: Doručovací služba
            time: '7:45'
            lines:
              - 'Zásilku č. 4471 2086 doručíme dnes mezi 13:00 a 15:00. Sledování: {{zasilky.dorucovatel.test/4471}}'
          recommended:
            - overim
          explanation: '**Může být pravá – ale ověřte si to.** Zpráva nechce peníze a uvádí číslo zásilky. Pokud nějakou čekáte, sledujte ji raději v aplikaci dopravce nebo přes e-mail z obchodu, ne přes odkaz v SMS.'
        - message:
            medium: email
            sender: Městská knihovna <info@knihovna-mesto.test>
            subject: Připomínka vrácení knihy
            lines:
              - Dobrý den, výpůjční lhůta knihy „Babička“ končí 15. října. Knihu můžete vrátit nebo prodloužit při příští návštěvě.
          recommended:
            - v-poradku
            - overim
          explanation: 'Nejspíš **v pořádku.** Zpráva uvádí konkrétní knihu, nic nechce a nikam vás nepopohání. Pokud jste si knihu půjčili, je to obyčejná připomínka.'
        - message:
            medium: sms
            sender: Zdravotní pojišťovna
            time: '11:30'
            lines:
              - 'Máte nárok na vrácení přeplatku 2 380 Kč. Pro vyplacení zadejte číslo své platební karty: {{pojistovna-vratky.test}}'
          recommended:
            - podvod
            - overim
          avoid:
            - v-poradku
          explanation: '**Podvod.** K tomu, abyste peníze dostali, nikdy nepotřebujete zadávat číslo karty. Pojišťovna vás v takovém případě kontaktuje dopisem nebo přes svůj oficiální portál.'
        - message:
            medium: popup
            sender: Upozornění prohlížeče
            lines:
              - 'Váš prohlížeč je zastaralý a nebezpečný! Klepněte sem a ihned stáhněte aktualizaci.'
          recommended:
            - podvod
            - overim
          avoid:
            - v-poradku
          explanation: '**Podvod.** Aktualizace se stahují přes Nastavení nebo obchod s aplikacemi, ne přes vyskakovací okno na webu. Okno zavřete, a když to nejde, zavřete celý prohlížeč.'
        - message:
            medium: email
            sender: Bazar <info@bazar-inzerce.test>
            subject: Váš inzerát byl zveřejněn
            lines:
              - Váš inzerát „Stará lampa“ je zveřejněn. Upravit nebo smazat ho můžete po přihlášení na webu bazaru.
          recommended:
            - v-poradku
            - overim
          explanation: 'Pokud jste inzerát opravdu podávali, je to **běžné potvrzení**. Nechce peníze ani údaje. Přihlaste se ale raději přes web nebo aplikaci bazaru, kterou znáte.'
        - message:
            medium: call
            sender: Neznámé číslo
            lines:
              - Dobrý den, tady kriminální policie. Váš účet je předmětem vyšetřování. Abyste o peníze nepřišli, musíte je dnes převést na zabezpečený účet.
          recommended:
            - podvod
            - overim
          avoid:
            - v-poradku
          explanation: '**Podvod.** Policie ani banka nikdy nechtějí, abyste převáděli peníze na „zabezpečený“ účet. Hovor ukončete. Pokud máte obavy, zavolejte na linku **158** sami.'
    lecturer:
      tips:
        - 'Šest zpráv je podvodných, pět je nejspíš v pořádku a jednu je dobré ověřit (zásilka). Volba „ověřím si to“ je vždy v pořádku – i u podvodů. Riskantní je jen označit podvod jako „v pořádku“ (zobrazí se „Pozor, riziko“). Cílem je, aby účastníci neviděli podvod úplně všude: většina zpráv, které dostávají, je v pořádku.'
        - Pokud nestíháte, projděte společně jen část zpráv a zbytek nechte na doma.
