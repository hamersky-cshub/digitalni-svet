# Zastávka workshopu. Každá položka v "screens" je jedna obrazovka (krok).
# Popis polí a typů aktivit najdete v README.md (sekce Úprava obsahu).

workshop: digitalni-stopa
order: 1
title: Co po mně zůstává
summary: Co je digitální stopa a kdy vzniká.
lecturer:
  time: 20 minut
  goal: Účastníci pochopí, že digitální stopa vzniká vědomě i automaticky. Bez strašení – stopa sama o sobě není nic špatného.
  discussion: Co jste dnes už dělali na telefonu nebo tabletu?
  transition: 'Víme, že stopa vzniká. Teď se podívejme na tu část, kterou máme nejvíc v rukou: co sdílíme my sami.'
screens:
  - kind: diskuse
    title: Co jste dnes dělali na internetu?
    text:
      - Každý den děláme na telefonu, tabletu nebo počítači spoustu drobných věcí. Často si je ani neuvědomujeme.
    activity:
      type: reflection
      question: 'Vzpomeňte si: co jste dnes nebo včera na internetu dělali?'
      hint: Nic nepište. Stačí si to promyslet, nebo to říct nahlas ve skupině.
      ideas:
        - Přečetl(a) jsem si zprávy.
        - Podíval(a) jsem se na počasí.
        - Napsal(a) jsem rodině.
        - Zaplatil(a) jsem kartou nebo v aplikaci.
  - kind: vyklad
    title: Co je digitální stopa?
    text:
      - 'Když jdete po sněhu, zůstávají za vámi stopy. Podobně je to na internetu: když ho používáte, zůstávají po vás informace. Říkáme jim **digitální stopa**.'
      - 'Digitální stopa vzniká dvěma způsoby:'
    points:
      - '**Sdílíte ji sami** – napíšete komentář, pošlete fotografii, vyplníte své jméno.'
      - '**Vzniká sama** – služby si automaticky zaznamenávají, co hledáte, kde jste nebo na co se díváte.'
  - kind: aktivita
    title: Vznikla digitální stopa?
    text:
      - U každé situace zvolte odpověď. Někdy digitální stopa vzniká, někdy ne. Nejde o test – po každé volbě se dozvíte, jak to je.
    activity:
      type: choices
      question: Vznikla při tom digitální stopa?
      options:
        - id: ano
          label: Ano
        - id: ne
          label: Ne
        - id: nevim
          label: Nejsem si jistý/á
      items:
        - text: Vyhledám si na internetu předpověď počasí.
          recommended:
            - ano
          explanation: Ano – i při běžném hledání mohou vznikat informace o naší aktivitě. Vyhledávač si může zapamatovat, co jste hledali, a stránka s počasím může zjistit, ve kterém městě přibližně jste.
        - text: Zaplatím na trhu za zeleninu hotovostí.
          recommended:
            - ne
          explanation: Ne – platba hotovostí nezanechá digitální záznam spojený s vaším jménem. Jiné by to bylo, kdybyste přiložili věrnostní kartu obchodu.
        - text: Podívám se na video na internetu.
          recommended:
            - ano
          explanation: Ano – služba s videi si obvykle pamatuje, co jste si pustili a jak dlouho jste se dívali. Podle toho vám pak nabízí další videa.
        - text: Napíšu rukou dopis a pošlu ho poštou.
          recommended:
            - ne
          explanation: Ne – ručně psaný dopis digitální stopu nevytváří. Jiné by to bylo, kdybyste ho vyfotili a poslali přes chat.
        - text: Zaplatím v obchodě platební kartou.
          recommended:
            - ano
          explanation: Ano – banka zaznamená, kde, kdy a kolik jste zaplatili. Uvidíte to i ve výpisu z účtu.
        - text: Zahraju si s vnoučaty deskovou hru u stolu.
          recommended:
            - ne
          explanation: Ne – pokud u toho nikdo nefotí a fotky nesdílí, digitální stopa nevzniká.
        - text: Napíšu komentář pod článek.
          recommended:
            - ano
          explanation: Ano – tentokrát je to stopa, kterou vytváříte vědomě. Komentář si mohou přečíst i lidé, které neznáte, a na internetu často zůstane dlouho.
        - text: Použiji navigaci v telefonu.
          recommended:
            - ano
          explanation: Ano – navigace potřebuje vědět, kde právě jste. Některé služby si polohu ukládají do historie, pokud to v nastavení nevypnete.
        - text: Přečtu si noviny, které jsem si koupil(a) v trafice.
          recommended:
            - ne
          explanation: Ne – papírové noviny o vás nic nezaznamenají. Na zpravodajském webu by to bylo jinak.
        - text: Zavolám kamarádce z mobilního telefonu.
          recommended:
            - ano
          explanation: Ano – obsah hovoru se běžně neukládá, ale operátor zaznamenává, komu jste volali, kdy a jak dlouho.
        - text: Pošlu fotografii známému ve zprávě.
          recommended:
            - ano
            - nevim
          explanation: Je to trochu složitější… Fotografie je hlavně u vás a u vašeho známého. Ten ji ale může poslat dál. A v samotné fotografii bývá uloženo, kdy a kde vznikla.
        - text: Vyfotím západ slunce starým fotoaparátem, který nemá připojení k internetu, a fotku nikam nenahraju.
          recommended:
            - ne
          explanation: Ne – dokud fotografii nikam nenahrajete, zůstává jen ve fotoaparátu. Pozor ale na chytré telefony – ty fotky často samy zálohují na internet.
        - text: Navštívím internetový obchod, ale nic nekoupím.
          recommended:
            - ano
          explanation: Ano – obchod si může zapamatovat, na co jste se dívali. Proto se vám pak stejné zboží může objevovat v reklamách i na jiných stránkách.
        - text: Jdu na procházku a telefon mám v kapse se zapnutou polohou.
          recommended:
            - ano
          explanation: Ano – i když telefon nepoužíváte, některé aplikace mohou polohu zaznamenávat na pozadí.
    lecturer:
      goal: U každé situace nechte chvíli na reakce. Odpověď „nejsem si jistý/á“ je v pořádku a stojí za diskusi. Situace bez digitální stopy ukazují, že offline svět stopu nezanechává – a čím se liší od online.
  - kind: vyklad
    title: Jak nás web sleduje
    text:
      - 'Část stopy vzniká automaticky, aniž byste cokoli napsali. Weby a reklamní firmy k tomu používají několik nástrojů:'
    points:
      - 🏠 **IP adresa** – něco jako adresa domu pro vaše připojení. Prozradí přibližně, odkud se připojujete.
      - 🍪 **Cookies** – malé lístečky, které si web uloží do prohlížeče. Některé jsou potřeba (třeba košík v obchodě), jiné slouží reklamním firmám ke sledování napříč weby.
      - 👁️ **Neviditelný obrázek v e-mailu** – drobný obrázek, který odesílateli prozradí, že a kdy jste e-mail otevřeli.
      - 🔍 **Otisk prohlížeče** – kombinace údajů o vašem zařízení (model, jazyk, nastavení). Je tak jedinečná, že vás web pozná i bez cookies.
      - 💡 Méně stop zanecháte s vyhledávačem, který si nepamatuje, co hledáte – například **Startpage** nebo **DuckDuckGo**.
    lecturer:
      goal: Stačí pochopit, že sledování existuje a dá se omezit. Technické detaily nejsou cílem.
      tips:
        - 'Zdroj: Minikurz kyberbezpečnosti pro uživatele – kapitola Trasování na webu.'
  - kind: aktivita
    title: Lišta s cookies
    text:
      - 'Na mnoha webech se objeví lišta s dotazem na cookies. Takhle může vypadat:'
    figures:
      - illustration: lista-cookies
        alt: Tablet se zpravodajským webem. Spodní část obrazovky zakrývá lišta „Vaše soukromí je pro nás důležité“ se třemi možnostmi – výrazné modré tlačítko Přijmout vše, méně nápadné tlačítko Odmítnout vše a odkaz Nastavení.
        caption: Tlačítko **Přijmout vše** bývá nápadné. **Odmítnout vše** nebo **Nastavení** jsou často méně vidět – stojí za to je hledat.
    activity:
      type: scenarios
      items:
        - text: 'Otevřete zpravodajský web a dole se objeví lišta: „Tento web používá cookies ke zlepšení služeb a k zobrazování reklamy.“ Pod ní jsou tři tlačítka.'
          question: Na co klepnete?
          options:
            - label: Přijmout vše – ať lišta zmizí.
              tone: info
              feedback: Je to nejrychlejší. Web a jeho reklamní partneři pak ale mohou sledovat, co si prohlížíte. Nic hrozného se nestane, jen sdílíte víc, než je nutné.
            - label: Odmítnout vše.
              tone: ok
              feedback: Výborně. Web bude fungovat dál a nebude sbírat údaje pro reklamu. Nezbytné cookies, třeba pro nákupní košík, zůstanou.
            - label: Nastavení – a nechám jen nezbytné.
              tone: ok
              feedback: Také dobrá volba. V nastavení obvykle stačí ponechat jen „nezbytné“ a volbu uložit.
          lesson: Hledejte tlačítko **Odmítnout vše** nebo **Pouze nezbytné**. Bývá méně nápadné – nespěchejte.
  - kind: reflexe
    title: Co vás překvapilo?
    text:
      - Digitální stopa není nic špatného – bez ní by řada služeb nefungovala. Je ale dobré vědět, že existuje, a rozhodovat se s rozmyslem.
    activity:
      type: reflection
      question: Která situace vás nejvíc překvapila?
      hint: Můžete to říct ostatním, nebo si to jen promyslet.
