# Zastávka workshopu. Každá položka v "screens" je jedna obrazovka (krok).
# Popis polí a typů aktivit najdete v README.md (sekce Úprava obsahu).

workshop: digitalni-stopa
order: 2
title: Co sdílím
summary: Komu svěřujeme jaké informace a proč na tom záleží.
goal: Promyslíte, komu co svěřit a co raději nezveřejnit.
icon: share
lecturer:
  time: 20 minut
  goal: Účastníci rozliší, že u informací rozhoduje komu, proč a zda je nutné je zveřejnit. U řady otázek neexistuje jediná správná odpověď.
  discussion: Kdy jste naposledy něco sdíleli a komu to bylo určené?
  transition: Informace sdílíme nejen my – někdy si o ně říkají i aplikace. Podívejme se, co jim dovolujeme.
screens:
  - kind: vyklad
    title: Záleží na tom, komu to říkáte
    text:
      - Informace nejsou samy o sobě dobré ani špatné. Stejná věc může být v pořádku v rodině a riskantní na internetu.
      - 'Než něco sdílíte, zeptejte se:'
    points:
      - '**Komu** to říkám? Rodině, známým, nebo všem na internetu?'
      - '**Proč** to sdílím? Potřebuje to druhý vědět?'
      - '**Musím** to zveřejnit? Nestačí to poslat jen jednomu člověku?'
    figures:
      - illustration: komu-to-rikam
        alt: 'Soustředné kruhy: uprostřed já, kolem rodina, dál přátelé a známí, venku všichni na internetu. Vedle zpráva „Příští týden jedeme na 14 dní k moři!“: rodině v pořádku, všem na internetu riskantní – zloděj ví, že dům bude prázdný.'
  - kind: aktivita
    title: Komu byste to řekli?
    text:
      - U každé informace zvolte, komu byste ji svěřili. Správná odpověď často závisí na situaci.
    activity:
      type: choices
      question: Komu byste to řekli?
      itemLabel: Informace
      options:
        - id: blizkym
          label: Jen blízkým
        - id: znamym
          label: Známým
        - id: verejne
          label: Klidně veřejně
        - id: nikomu
          label: Nikomu
      items:
        - text: Kdy jedu na dovolenou.
          recommended:
            - blizkym
          responses:
            verejne:
              tone: risk
              text: Veřejná informace, že nejste doma, může zajímat i zloděje.
          explanation: O dovolené je dobré vědět jen blízkým. Fotografie z cest můžete klidně zveřejnit až po návratu.
        - text: Recept na bábovku.
          recommended:
            - blizkym
            - znamym
            - verejne
          explanation: Recept je v pořádku sdílet s kýmkoli – klidně i veřejně. Nic o vás neprozradí.
        - text: PIN k platební kartě.
          recommended:
            - nikomu
          responses:
            blizkym:
              tone: risk
              text: Ani blízkým PIN neříkejte. Pokud potřebují platit za vás, banka jim může vydat vlastní kartu k vašemu účtu.
            znamym:
              tone: risk
              text: PIN známým nikdy neříkejte. Kdo zná PIN a má kartu, může z účtu vybrat peníze.
            verejne:
              tone: risk
              text: PIN nesmí být nikde zveřejněný – ani zapsaný na kartě nebo v peněžence.
          explanation: PIN neříkejte nikomu. Banka ani policie ho po vás nikdy nebude chtít.
        - text: Moje telefonní číslo.
          recommended:
            - blizkym
            - znamym
          responses:
            verejne:
              tone: risk
              text: Veřejně dostupné číslo mohou zneužít podvodníci k falešným telefonátům a SMS.
          explanation: Telefonní číslo dáváme lidem a firmám, které ho opravdu potřebují. Na internetu ho zveřejňovat nemusíte.
        - text: Fotografie z výletu – už jsem zpátky doma.
          recommended:
            - blizkym
            - znamym
            - verejne
          explanation: Po návratu je sdílení fotografií z cest bezpečnější – nikdo už z nich nevyčte, že nejste doma. Jen zkontrolujte, co je na nich vidět.
        - text: Fotografie vnoučete.
          recommended:
            - blizkym
          responses:
            verejne:
              tone: risk
              text: Fotografii na veřejném profilu může vidět kdokoli – a dítě o tom samo rozhodnout nemůže.
          explanation: U fotografií dětí se nejdřív zeptejte rodičů, zda se sdílením souhlasí. Nejbezpečnější je posílat je jen rodině.
        - text: Datum narození.
          recommended:
            - blizkym
            - znamym
          responses:
            verejne:
              tone: risk
              text: Datum narození slouží k ověření totožnosti – v bance, u lékaře i u operátora. Veřejně ho neuvádějte.
          explanation: Blízcí a známí vám rádi popřejí. Na sociální síti můžete datum narození v nastavení profilu skrýt.
        - text: Fotografie narozeninového dortu.
          recommended:
            - blizkym
            - znamym
            - verejne
          explanation: Tady je to v pořádku téměř kdekoli. Jen se podívejte, co je na fotografii kolem dortu – třeba přáníčko s celým jménem a datem narození.
        - text: Že jsem právě v nemocnici.
          recommended:
            - blizkym
          responses:
            znamym:
              tone: info
              text: Známým stačí říct obecně, že se léčíte. Podrobnosti o zdraví nechte pro blízké.
            verejne:
              tone: risk
              text: Zdravotní údaje patří k nejcitlivějším. Veřejná zpráva navíc prozradí, že nejste doma.
          explanation: O svém zdraví rozhodujete sami, komu co řeknete. Na internet podrobnosti nepatří.
        - text: Adresa bydliště.
          recommended:
            - blizkym
          responses:
            znamym:
              tone: info
              text: Známým ji říct můžete, pokud ji potřebují – třeba když vás jdou navštívit.
            verejne:
              tone: risk
              text: Veřejná adresa spolu s informací, že nejste doma, je pro zloděje cenná.
          explanation: Adresu potřebují blízcí, lékař nebo doručovací služba. Na sociálních sítích ji zveřejňovat nemusíte.
        - text: Jméno mého domácího mazlíčka.
          recommended:
            - blizkym
            - znamym
          responses:
            verejne:
              tone: info
              text: Jméno mazlíčka často slouží jako odpověď na bezpečnostní otázku nebo jako součást hesla. Pokud ho tak používáte, veřejně ho nesdílejte.
          explanation: Samo o sobě je jméno mazlíčka nevinné. Jen ho nepoužívejte jako heslo.
        - text: Hodnocení knihy, kterou jsem přečetl(a).
          recommended:
            - blizkym
            - znamym
            - verejne
          explanation: Hodnocení knihy je běžná veřejná informace a může pomoci dalším čtenářům. Stačí, když v něm nebudou osobní údaje.
        - text: Že bydlím sám/sama.
          recommended:
            - blizkym
          responses:
            znamym:
              tone: info
              text: Důvěryhodným známým, třeba sousedům, to vědět může pomoci. Jinak to sdílet nemusíte.
            verejne:
              tone: risk
              text: Veřejná informace, že bydlíte sami, může přilákat podvodníky – třeba falešné řemeslníky nebo „vnuky“ v nouzi.
          explanation: Tuto informaci sdílejte jen s lidmi, kterým důvěřujete.
        - text: Číslo mého bankovního účtu.
          recommended:
            - blizkym
            - znamym
          responses:
            verejne:
              tone: info
              text: Číslo účtu samo o sobě peníze neohrozí. Veřejně ho ale vystavovat nemusíte.
          explanation: Na rozdíl od PINu nebo hesla není číslo účtu tajné. Dáváte ho tomu, kdo vám má zaplatit.
        - text: Fotografie letenky nebo palubní vstupenky.
          recommended:
            - nikomu
          responses:
            blizkym:
              tone: info
              text: 'Blízkým v soukromé zprávě to riziko není velké. Přesto: zakryjte jméno a kód.'
            znamym:
              tone: risk
              text: Čím víc lidí fotografii uvidí, tím větší je riziko zneužití.
            verejne:
              tone: risk
              text: Na vstupence je kód, ze kterého lze zjistit jméno a rezervaci – a někdy dokonce let změnit nebo zrušit.
          explanation: Palubní vstupenky raději nefoťte. Pro radost z cesty stačí fotografie z letiště nebo z okna letadla.
    lecturer:
      goal: Zdůrazněte, že u dortu, receptu nebo knihy je v pořádku téměř jakákoli odpověď. PIN patří jen vám – nikomu. Cílem je přemýšlet o kontextu, ne „trefit se“.
  - kind: vyklad
    title: Kdo ještě tvoří vaši stopu?
    text:
      - Vaši digitální stopu netvoříte jen vy. Rodina a přátelé mohou sdílet vaše fotografie, označit vás na nich nebo prozradit, kde zrovna jste – většinou v dobré víře.
      - 'Na sociálních sítích pomáhá:'
    points:
      - Uvádějte jen nezbytné údaje.
      - Nezveřejňujte fotografie svého domova a jeho okolí.
      - Nastavte si účet jako soukromý a nastavení občas zkontrolujte.
      - Rozmyslete si, zda sdílet svou polohu.
      - Na zprávy od neznámých účtů neodpovídejte hned.
      - Zapněte ((dvoufázové ověření|dvoufazove-overeni)) (více na setkání Digitální klíče).
    lecturer:
      discussion: Požádali jste někdy blízké, aby vaši fotografii nesdíleli? Jak to přijali?
  - kind: reflexe
    title: Udělal(a) bych to dnes jinak?
    activity:
      type: reflection
      question: Vzpomenete si na něco, co jste v minulosti sdíleli a dnes byste to udělali jinak?
      hint: Nemusíte to nikomu říkat. Stačí, když si to promyslíte.
  - kind: aktivita
    title: Kterou fotografii byste sdíleli?
    text:
      - 'Podívejte se na dvě fotografie. Obě vypadají nevinně – ale jedna z nich prozrazuje víc, než by se zdálo.'
    figures:
      - illustration: foto-bezpecna
        alt: 'Fotografie A: narozeninový dort se třemi svíčkami na talíři, vedle váza s květinami, v pozadí rozmazaná světýlka. Nejsou na ní žádné osobní údaje.'
        caption: '**Fotografie A** – narozeninový dort na stole.'
      - illustration: foto-prozrazujici
        alt: 'Fotografie B: osoba v klobouku s kufry před vchodovými dveřmi domu. Na zdi je cedule ulice Vzorová, číslo domu 12 a jmenovka Ukázkovi, vedle stojí auto s čitelnou registrační značkou 1AB 2345.'
        caption: '**Fotografie B** – odjezd na dovolenou před domem.'
    activity:
      type: scenarios
      items:
        - text: Představte si, že jste fotografie pořídili vy a chcete je ukázat přátelům.
          question: Kterou fotografii byste klidně dali na sociální síť?
          options:
            - label: Fotografii A – dort
              tone: ok
              feedback: Ano. Na fotografii dortu není nic, co by o vás prozradilo osobní údaje.
            - label: Fotografii B – odjezd před domem
              tone: risk
              feedback: 'Fotografie B prozrazuje ulici, číslo domu, příjmení na jmenovce i registrační značku auta. A kufry říkají: „Teď odjíždíme, dům bude prázdný.“'
            - label: Obě fotografie
              tone: risk
              feedback: 'Fotografie A je v pořádku. Fotografie B ale prozrazuje adresu, příjmení, registrační značku a to, že odjíždíte.'
          lesson: Fotografii B by stačilo oříznout nebo zakrýt cedule a značku – a zveřejnit ji až po návratu domů.
  - kind: prakticky
    title: Než pošlu fotografii dál
    text:
      - 'Teď si to vyzkoušíte sami: vyfotíte cokoli kolem sebe, fotografii si prohlédnete jako fotografii B a upravíte ji tak, aby na ní zůstalo jen to, co chcete ukázat. Fotografii nikam neposíláte a na konci ji smažete.'
    activity:
      type: guide
      intro: Nic si nemusíte připravovat – stačí to, co máte kolem sebe.
      steps:
        - text: Otevřete aplikaci **Fotoaparát** – má ikonu fotoaparátu 📷.
        - text: Vyfoťte, co máte před sebou – stůl, okno, svou tašku nebo vlastní ruku. Ostatní účastníky bez jejich souhlasu nefoťte. Klepněte na velké kulaté tlačítko. Fotografie je hotová.
        - text: Klepněte na malý náhled fotografie v rohu obrazovky. Fotografii si zvětšete roztažením dvěma prsty a prohlédněte si i okraje a pozadí.
          question: Co všechno je na fotografii vidět? Zachytili jste i něco, co jste fotit nechtěli – papír, obrazovku, nápis nebo jiného člověka?
        - text: Klepněte na **Upravit** (na tabletu s Androidem často ikona tužky) a vyberte **Oříznout**. Posuňte rohy rámečku tak, aby na fotografii zůstala jen jedna věc – třeba hrnek nebo vaše ruka.
        - text: 'Představte si, že je uprostřed fotografie adresa nebo registrační značka. V úpravách najděte ikonu **pera** (na iPadu **Označení**, na Androidu **Kreslit**) a přes to místo přetáhněte silnou tmavou čáru.'
        - text: Klepněte na **Hotovo** nebo **Uložit**. Prohlédněte si upravenou fotografii – zbylo jen to, co chcete ukázat?
          question: Komu byste takovou fotografii poslali? Rodinná skupina není totéž jako veřejný příspěvek.
        - text: Zkušební fotografii smažte – klepněte na ikonu **koše** 🗑️ a smazání potvrďte. Tablet budou používat i další účastníci.
      outro: Hotovo. Stejně se můžete podívat na každou fotografii, než ji doma pošlete dál. Postup najdete i v návodu „Jak oříznout nebo zakrýt údaje na fotografii“ v části Zdroje a materiály. I rozhodnutí něco nesdílet je dobrý výsledek.
    lecturer:
      time: 10 minut
      goal: Přenést zásady sdílení do vlastní zkušenosti bez zveřejňování skutečných údajů. Účastníci si vyzkoušejí focení, prohlížení, oříznutí a zakrytí části fotografie.
      tips:
        - Nejsou potřeba žádné rekvizity. Kdo neví, co vyfotit, ať vyfotí vlastní ruku na stole nebo okno.
        - Názvy tlačítek se liší podle tabletu (iPad – Upravit, ikona oříznutí a pero Označení; Android – tužka, Oříznout nebo Transformovat, Kreslit). Projděte místností a pomozte.
        - Kdo nestíhá, může zakrytí perem vynechat – oříznutí stačí.
        - Zkontrolujte, že účastníci na konci zkušební fotografie smazali. Na iPadu se smazané fotky ještě 30 dní drží v albu Nedávno smazané – po workshopu je vyprázdněte.
