      explanation: Čtyři náhodná slova tvoří heslo, které je dlouhé a pro počítač velmi těžko uhodnutelné. Pro skutečné heslo si vymyslete **vlastní** slova – ne ta z tohoto webu. Nepoužívejte citáty, texty písní ani známá rčení – útočníci je zkoušejí.
  - kind: prakticky
    title: Kostková metoda
    text:
      - Opravdu náhodná slova vybere hod kostkou. Metodě se říká **Diceware** (kostková metoda). Vyzkoušejte si ji s virtuálními kostkami a malou ukázkovou tabulkou.
      - Klepněte na tlačítko. První kostka určí řádek tabulky, druhá sloupec. Po čtyřech hodech máte heslovou frázi ze čtyř slov.
    activity:
      type: dice
      warning: Tabulka je jen ukázková a krátká. Takto vytvořenou frázi nepoužívejte jako skutečné heslo.
      count: 4
