      explanation: 'Skutečný seznam má **7 776 slov** a hází se **pěti kostkami** najednou – proto je výsledek tak těžké uhodnout. Pro skutečné heslo si doma hoďte skutečnými kostkami alespoň pětkrát, ať máte **5 slov**. Český seznam slov najdete v části Zdroje a materiály na přehledu modulu.'
    lecturer:
      tips:
        - Kostky ani vytištěný seznam nejsou potřeba – vše proběhne v tabletu. Kdo chce, může si metodu doma vyzkoušet se skutečnými kostkami podle návodu ve Zdrojích a materiálech.
        - Virtuální kostky používají náhodný generátor prohlížeče. Nic se neukládá ani neodesílá.
