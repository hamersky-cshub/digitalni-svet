# Zastávka workshopu. Každá položka v "screens" je jedna obrazovka (krok).
# Popis polí a typů aktivit najdete v README.md (sekce Úprava obsahu).

workshop: digitalni-klice
order: 5
title: Druhý zámek
summary: Dvoufázové ověření a novější způsoby přihlašování.
goal: Vyzkoušíte si druhý zámek – dvoufázové ověření.
icon: lock
lecturer:
  time: 30 minut
  goal: Vysvětlit dvoufázové ověření a zásadu nepotvrzovat přihlášení, které jsem sám/sama nezahájil(a). Krátce zmínit přístupové klíče (passkeys).
  discussion: Potvrzujete už něco v telefonu, třeba platby v bankovnictví?
  transition: Shrňme si čtyři návyky, které vaše účty ochrání.
screens:
  - kind: vyklad
    title: Dva zámky jsou víc než jeden
    text:
      - '**Dvoufázové ověření** znamená, že k přihlášení nestačí jen heslo.'
    points:
      - 🔑 **První zámek:** heslo, které znáte.
      - 📱 **Druhý zámek:** potvrzení v telefonu nebo ((kód z SMS|kod-z-sms)).
      - 🛡️ I když někdo zjistí vaše heslo, bez vašeho telefonu se dovnitř nedostane.
      - ✅ Jakékoli druhé ověření je lepší než žádné.
    figures:
      - illustration: dva-zamky
        alt: 'Tři kroky přihlášení: 1. heslo – to, co znáte, 2. telefon s kódem z SMS – to, co máte, 3. přihlášeno – teprve s obojím. Pod tím podvodník, který zjistil heslo: první krok projde, u telefonu se zastaví a účet zůstane zamčený.'
  - kind: aktivita
    title: Něco víte, něco máte, něco jste
    text:
      - 'Ověřit, že jste to vy, lze třemi způsoby: něčím, co **víte**, něčím, co **máte**, a něčím, co **jste**. Dvoufázové ověření kombinuje dva z nich.'
    activity:
      type: choices
      itemLabel: Položka
      question: Do které skupiny to patří?
      options:
        - id: vite
          label: 🧠 Něco, co víte
        - id: mate
          label: 📱 Něco, co máte
        - id: jste
          label: 👤 Něco, co jste
      items:
        - text: PIN
          recommended:
            - vite
          explanation: PIN je **něco, co víte** – máte ho v hlavě, stejně jako heslo.
        - text: Telefon, do kterého přijde žádost o potvrzení
          recommended:
            - mate
          explanation: Telefon je **něco, co máte** u sebe. Útočník ho nemá, i když zná vaše heslo.
        - text: Otisk prstu
          recommended:
            - jste
          explanation: Otisk prstu je **něco, co jste** – část vás samých.
        - text: Odpověď na kontrolní otázku, třeba „Jméno vaší první učitelky“
          recommended:
            - vite
          explanation: Je to **něco, co víte**. Pozor ale – odpověď může znát i někdo jiný nebo ji najde na internetu. Klidně si vymyslete odpověď, kterou zná jen vy.
        - text: Platební karta
          recommended:
            - mate
          explanation: Karta je **něco, co máte**. Proto se k platbě kartou přidává ještě PIN – tedy něco, co víte.
        - text: Heslo
          recommended:
            - vite
          explanation: Heslo je **něco, co víte**. Proto ho nikomu neříkejte.
        - text: Obličej
          recommended:
            - jste
          explanation: Rozpoznání obličeje je také **něco, co jste**.
        - text: Kód z SMS
          recommended:
            - mate
          explanation: Kód přijde do telefonu, který **máte** u sebe. Proto ho nikomu nesdělujte – tím byste „půjčili“ svůj telefon.
        - text: Gesto (obrazec), kterým odemykáte telefon
          recommended:
            - vite
          explanation: Gesto je **něco, co víte** – podobně jako PIN, jen ho kreslíte prstem. Při zadávání se rozhlédněte, ať vám nikdo nekouká přes rameno.
        - text: Hlas
          recommended:
            - jste
          explanation: Hlas je **něco, co jste**. Umělá inteligence ho ale dokáže napodobit – proto banky na ověření hlasem samotným nespoléhají.
        - text: Aplikace v telefonu, která ukazuje měnící se kód
          recommended:
            - mate
          explanation: Je to **něco, co máte** – kód se ukáže jen v telefonu, který držíte v ruce. Říká se jí ověřovací aplikace.
        - text: Bezpečnostní klíč – malé zařízení na klíčence
          recommended:
            - mate
          explanation: Je to **něco, co máte**. Přikládá se k telefonu nebo zasouvá do počítače. Pro běžné použití ho nepotřebujete, ale je velmi bezpečný.
    lecturer:
      tips:
        - 'V podkladech: Knowledge (něco víte), Possession (něco máte), Inherence (něco jste).'
  - kind: aktivita
    title: Vyzkoušejte si přihlášení
    text:
      - Projděte si, jak takové přihlášení vypadá. Je to jen ukázka – nic skutečného se nezadává.
    activity:
      type: login
      service: E-mail
      password: Heslo je zadané. To je první zámek.
      request: 'Přihlašujete se do e-mailu? Zařízení: tablet, právě teď. Potvrďte jen tehdy, když se přihlašujete vy.'
      done: 'Přístup je povolen. Prošli jste oběma zámky: heslem i potvrzením v telefonu.'
      denied: Přihlášení je zastavené. Odmítnout je správné vždy, když se nepřihlašujete vy. Tady jste se ale přihlašovali sami, takže jste mohli potvrdit.
  - kind: aktivita
    title: Žádost, kterou jste nečekali
    activity:
      type: scenarios
      items:
        - text: 'Večer se díváte na televizi a na e-mail se nepřihlašujete. Najednou vám v telefonu přijde tato žádost:'
          message:
            medium: notification
            sender: Žádost o přihlášení
            lines:
              - 'Přihlašujete se do e-mailu? Zařízení: neznámý počítač, právě teď. Potvrdit?'
          question: Co uděláte?
          options:
            - label: Potvrdím, asi je to nějaká aktualizace.
              tone: risk
              feedback: Pokud jste přihlášení nezahájili, potvrzením byste pustili dovnitř někoho cizího – nejspíš někoho, kdo zná vaše heslo.
            - label: Odmítnu a pak si změním heslo.
              tone: ok
              feedback: Správně. Žádost znamená, že někdo zná vaše heslo – a druhý zámek ho zastavil. Heslo si změňte, případně požádejte o pomoc.
            - label: Žádost budu ignorovat.
              tone: info
              feedback: Je to lepší než potvrdit. Jistější je ale žádost odmítnout a změnit heslo – útočník to může zkoušet znovu.
          lesson: '**Nikdy nepotvrzujte přihlášení, které jste sami nezahájili.**'
  - kind: aktivita
    title: Přihlášení bez hesla
    text:
      - Novější služby někdy umožňují přihlášení **otiskem prstu, obličejem nebo PINem zařízení** místo klasického hesla. Říká se tomu **přístupový klíč** (anglicky passkey).
      - Váš tablet nebo telefon sám potvrdí, že jste to vy. Takové přihlášení podvodník nemůže vylákat přes falešnou stránku.
    points:
      - Když vám služba přístupový klíč nabídne, můžete ho klidně vyzkoušet.
      - Nemusíte nic nastavovat hned – stačí vědět, že tato možnost existuje.
    figures:
      - illustration: pristupovy-klic
        alt: 'Místo hesla tři způsoby potvrzení: otisk prstu, obličej a PIN zařízení. Uprostřed telefon s přihlášením do služby Moje pošta a výzvou „Přiložte prst“. Vpravo falešná stránka posta-login.test s přeškrtnutým rybářským háčkem a nápisem „Falešná stránka nemá co vylákat“.'
        caption: '**Přístupový klíč zůstává ve vašem zařízení.** Nikam ho neopisujete, a tak ho nikdo nevyláká.'
    activity:
      type: autofill
      method: passkey
      service: Moje pošta
      task: Vyzkoušejte si přihlášení přístupovým klíčem. Otevřete jednu stránku a pak druhou.
      sites:
        - address: mojeposta.test
          genuine: true
          result: Zařízení se zeptalo jen na otisk prstu a jste přihlášeni. Žádné heslo, které by šlo vylákat.
        - address: mojeposta-prihlaseni.test
          genuine: false
          result: Přístupový klíč patří jen k pravé adrese, a tak ho zařízení na napodobené stránce vůbec nenabídne. Podvodník nemá co vylákat.
  - kind: prakticky
    title: Najděte druhé ověření – nanečisto
    text:
      - Kde se dvoufázové ověření zapíná? Vyzkoušejte si to na ukázce e-mailu. Žádný skutečný účet ani heslo nepotřebujete.
    activity:
      type: settings
      task: 'Úkol: najděte v nastavení e-mailu, kde se zapíná dvoufázové ověření.'
      screens:
        - title: Můj e-mail
          items:
            - Doručená pošta
            - Odeslané
            - Koš
            - ⚙️ Nastavení
          correct: ⚙️ Nastavení
          hint: Tady jsou zprávy. Nastavení účtu bývá schované pod ikonou **ozubeného kola ⚙️** nebo pod vaším jménem či fotkou.
        - title: Nastavení
          items:
            - Vzhled a velikost písma
            - Oznámení
            - Podpis ve zprávách
            - 🔒 Zabezpečení a přihlášení
          correct: 🔒 Zabezpečení a přihlášení
          hint: Tohle nastavení s přihlášením nesouvisí. Hledejte slovo **Zabezpečení**, **Bezpečnost** nebo **Přihlášení** – často u ikony zámku 🔒.
        - title: Zabezpečení a přihlášení
          items:
            - Změnit heslo
            - Zařízení, na kterých jste přihlášeni
            - Dvoufázové ověření
            - Obnovení účtu – telefon a e-mail
          correct: Dvoufázové ověření
          hint: I to je užitečné místo – ale teď hledáme druhý zámek. Hledejte **Dvoufázové ověření**, **Dvoufaktorové ověření** nebo **Ověření ve dvou krocích**.
      final:
        title: Dvoufázové ověření
        label: Dvoufázové ověření
        status: Vypnuto
        action: Zapnout
        text: 'Našli jste ho! Ve skutečné službě by vás teď provedla krátkým postupem – obvykle zadáte své telefonní číslo a opíšete kód z SMS, nebo potvrdíte přihlášení v telefonu. V ukázce se nic nezapíná. Názvy položek se v různých službách mohou trochu lišit.'
    lecturer:
      time: 5 minut
      goal: Najít cestu k dvoufázovému ověření bez skutečného účtu a bez rizika ztráty přístupu.
      tips:
        - Pokud účastník klepne jinam, ukáže se mu nápověda. Ukázka se dá projít znovu.
  - kind: prakticky
    title: Na vlastním telefonu (nepovinné)
    text:
      - Máte s sebou vlastní telefon s e-mailem? Zkuste stejnou cestu najít ve svém účtu. Na workshopových tabletech se do svého e-mailu nepřihlašujte.
      - Hesla ani kódy nikomu neukazujte. Nastavení zatím jen prohlédněte.
    activity:
      type: guide
      steps:
        - text: Otevřete nastavení svého účtu. Hledejte část **Zabezpečení**, **Přihlášení** nebo **Bezpečnost účtu**. Názvy se liší podle služby.
        - text: Najděte položku **Dvoufázové ověření**, **Dvoufaktorové ověření** nebo **Ověření ve dvou krocích**. Pokud ji nevidíte, požádejte o pomoc.
        - text: Podívejte se, zda je ověření zapnuté. Pokud ano, nic měnit nemusíte. Pokud ne, přečtěte si, jaké možnosti služba nabízí.
        - text: Před zapnutím si ověřte, že máte dostupný telefon a způsob obnovení účtu. Postup dokončete jen tehdy, když mu rozumíte; jinak si domluvte pomoc. Záložní kódy si uschovejte v soukromí.
      outro: I nalezení správného nastavení je pokrok. Doma vám pomůže návod „Dvoufázové ověření krok za krokem“ v části Zdroje a materiály. Nikdy nepotvrzujte přihlášení, které jste sami nezahájili.
    lecturer:
      time: 5 minut
      goal: Kdo má vlastní telefon, zjistí stav druhého ověření ve svém účtu.
      tips:
        - Každý účastník může používat jinou službu. Nevyžadujte zapnutí během skupinového setkání.
        - Účastníci bez vlastního telefonu si zatím mohou ukázku nanečisto projít znovu nebo si přečíst návod ve Zdrojích a materiálech.
