# Zastávka workshopu. Každá položka v "screens" je jedna obrazovka (krok).
# Popis polí a typů aktivit najdete v README.md (sekce Úprava obsahu).

workshop: digitalni-klice
order: 5
title: Druhý zámek
summary: Dvoufázové ověření a novější způsoby přihlašování.
lecturer:
  time: 20 minut
  goal: Vysvětlit dvoufázové (vícefaktorové) ověření a zásadu nepotvrzovat přihlášení, které jsem sám/sama nezahájil(a). Krátce zmínit přístupové klíče (passkeys).
  discussion: Potvrzujete už něco v telefonu, třeba platby v bankovnictví?
  transition: Shrňme si čtyři návyky, které vaše účty ochrání.
screens:
  - kind: vyklad
    title: Dva zámky jsou víc než jeden
    text:
      - '**Dvoufázové ověření** (někdy také vícefaktorové) znamená, že k přihlášení nestačí jen heslo.'
    points:
      - 🔑 **První zámek:** heslo, které znáte.
      - 📱 **Druhý zámek:** potvrzení v telefonu nebo kód z SMS.
      - 🛡️ I když někdo zjistí vaše heslo, bez vašeho telefonu se dovnitř nedostane.
      - ✅ Jakékoli druhé ověření je lepší než žádné.
  - kind: aktivita
    title: Něco víte, něco máte, něco jste
    text:
      - 'Ověřit, že jste to vy, lze třemi způsoby: něčím, co **víte**, něčím, co **máte**, a něčím, co **jste**. Dvoufázové ověření kombinuje dva z nich.'
    activity:
      type: choices
      itemLabel: Položka
      question: Do které skupiny to patří?
      options:
        - id: vite
          label: 🧠 Něco, co VÍTE
        - id: mate
          label: 📱 Něco, co MÁTE
        - id: jste
          label: 👤 Něco, co JSTE
      items:
        - text: PIN
          recommended:
            - vite
          explanation: PIN je **něco, co víte** – máte ho v hlavě, stejně jako heslo.
        - text: Heslo
          recommended:
            - vite
          explanation: Heslo je **něco, co víte**. Proto ho nikomu neříkejte.
        - text: Telefon, do kterého přijde žádost o potvrzení
          recommended:
            - mate
          explanation: Telefon je **něco, co máte** u sebe. Útočník ho nemá, i když zná vaše heslo.
        - text: Kód z SMS
          recommended:
            - mate
          explanation: Kód přijde do telefonu, který **máte** u sebe. Proto ho nikomu nesdělujte – tím byste „půjčili“ svůj telefon.
        - text: Otisk prstu
          recommended:
            - jste
          explanation: Otisk prstu je **něco, co jste** – část vás samých.
        - text: Obličej
          recommended:
            - jste
          explanation: Rozpoznání obličeje je také **něco, co jste**.
    lecturer:
      tips:
        - 'V podkladech: Knowledge (něco víte), Possession (něco máte), Inherence (něco jste).'
  - kind: aktivita
    title: Vyzkoušejte si přihlášení
    text:
      - Projděte si, jak takové přihlášení vypadá. Je to jen ukázka – nic skutečného se nezadává.
    activity:
      type: login
      service: E-mail
      password: Heslo je zadané. To je první zámek.
      request: 'Přihlašujete se do e-mailu? Zařízení: tablet, právě teď. Potvrďte jen tehdy, když se přihlašujete vy.'
      done: 'Přístup je povolen. Prošli jste oběma zámky: heslem i potvrzením v telefonu.'
      denied: Přihlášení je zastavené. Odmítnout je správné vždy, když se nepřihlašujete vy. Tady jste se ale přihlašovali sami, takže jste mohli potvrdit.
  - kind: aktivita
    title: Žádost, kterou jste nečekali
    activity:
      type: scenarios
      items:
        - text: 'Večer se díváte na televizi a na e-mail se nepřihlašujete. Najednou vám v telefonu přijde tato žádost:'
          message:
            medium: notification
            sender: Žádost o přihlášení
            lines:
              - 'Přihlašujete se do e-mailu? Zařízení: neznámý počítač, právě teď. Potvrdit?'
          question: Co uděláte?
          options:
            - label: Potvrdím, asi je to nějaká aktualizace.
              tone: risk
              feedback: Pokud jste přihlášení nezahájili, potvrzením byste pustili dovnitř někoho cizího – nejspíš někoho, kdo zná vaše heslo.
            - label: Odmítnu a pak si změním heslo.
              tone: ok
              feedback: Správně. Žádost znamená, že někdo zná vaše heslo – a druhý zámek ho zastavil. Heslo si změňte, případně požádejte o pomoc.
            - label: Žádost budu ignorovat.
              tone: info
              feedback: Je to lepší než potvrdit. Jistější je ale žádost odmítnout a změnit heslo – útočník to může zkoušet znovu.
          lesson: '**Nikdy nepotvrzujte přihlášení, které jste sami nezahájili.**'
  - kind: vyklad
    title: Přihlášení bez hesla
    text:
      - Novější služby někdy umožňují přihlášení **otiskem prstu, obličejem nebo PINem zařízení** místo klasického hesla. Říká se tomu **přístupový klíč** (anglicky passkey).
      - Váš tablet nebo telefon sám potvrdí, že jste to vy. Takové přihlášení podvodník nemůže vylákat přes falešnou stránku.
    points:
      - Když vám služba přístupový klíč nabídne, můžete ho klidně vyzkoušet.
      - Nemusíte nic nastavovat hned – stačí vědět, že tato možnost existuje.
  - kind: prakticky
    title: Najděte druhé ověření ve svém e-mailu
    text:
      - Na svém zařízení otevřete e-mail tak, jak to děláte běžně. Hesla ani kódy nikomu neukazujte. Nastavení zatím jen prohlédněte.
    activity:
      type: guide
      steps:
        - text: Otevřete nastavení svého účtu. Hledejte část **Zabezpečení**, **Přihlášení** nebo **Bezpečnost účtu**. Názvy se liší podle služby.
        - text: Najděte položku **Dvoufázové ověření**, **Dvoufaktorové ověření** nebo **Ověření ve dvou krocích**. Pokud ji nevidíte, požádejte o pomoc.
        - text: Podívejte se, zda je ověření zapnuté. Pokud ano, nic měnit nemusíte. Pokud ne, společně si přečtěte, jaké možnosti služba nabízí.
        - text: Před zapnutím si ověřte, že máte dostupný telefon a způsob obnovení účtu. Postup dokončete jen tehdy, když mu rozumíte; jinak si domluvte pomoc. Záložní kódy si uschovejte v soukromí.
      outro: I nalezení správného nastavení je pokrok. Nikdy nepotvrzujte přihlášení, které jste sami nezahájili.
    lecturer:
      time: 10 minut
      goal: Najít stav druhého ověření bez rizika ztráty přístupu k účtu.
      tips:
        - Každý účastník může používat jinou službu. Nevyžadujte zapnutí během skupinového setkání.
