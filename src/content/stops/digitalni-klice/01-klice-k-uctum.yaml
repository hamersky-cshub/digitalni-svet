# Zastávka workshopu. Každá položka v "screens" je jedna obrazovka (krok).
# Popis polí a typů aktivit najdete v README.md (sekce Úprava obsahu).

workshop: digitalni-klice
order: 1
title: Klíče k digitálnímu životu
summary: Proč jsou hesla jako klíče od bytu.
goal: Pochopíte, proč jsou hesla klíče k vašim účtům.
icon: key
lecturer:
  time: 10 minut
  goal: Navázat na zkušenost účastníků a zavést přirovnání heslo = klíč.
  discussion: Kolik různých hesel přibližně používáte? Jak si je pamatujete?
  transition: Jak se útočníci k heslům vůbec dostanou? To si ukážeme na další zastávce.
  tips:
    - Nikdo nemusí říkat svá skutečná hesla – ani na workshopu.
    - Průměrný člověk má 87 hesel k osobním a 168 k pracovním účtům (NordPass Password Survey 2024).
screens:
  - kind: diskuse
    title: Kolik klíčů nosíte?
    activity:
      type: reflection
      question: Kolik účtů s heslem používáte?
      hint: Nic nepište. Stačí si to v duchu spočítat.
      ideas:
        - E-mail
        - Internetové bankovnictví
        - Sociální síť nebo chat
        - Internetový obchod
        - Portál zdravotní pojišťovny nebo úřadu
  - kind: vyklad
    title: Hesla nejsou nic nového
    text:
      - 'Hesla lidé používají už tisíce let:'
    points:
      - 🏛️ **Starověký Řím** – vojáci si heslo na noc předávali na dřevěné destičce.
      - 🥃 **Prohibice v USA** – do tajných barů se vcházelo jen se správným heslem.
      - ⚙️ **Druhá světová válka** – zprávy chránil šifrovací stroj Enigma.
      - 💻 **Rok 1961** – první počítačová hesla na univerzitě MIT.
    figures:
      - illustration: hesla-v-case
        alt: 'Časová osa hesel: vosková destička z antického Říma, dveře tajného baru s okénkem a otázkou „Heslo?“, šifrovací stroj Enigma, počítačový terminál z roku 1961 a dnešní tablet s polem pro heslo.'
        caption: '**Princip se nemění:** kdo zná heslo, smí dovnitř. Dnes jen hesla potřebujeme k desítkám účtů.'
  - kind: vyklad
    title: Heslo je klíč
    text:
      - Heslo chrání váš účet podobně jako klíč chrání byt. Kdo zná heslo, dostane se dovnitř.
      - Dnes má průměrný člověk kolem **87 hesel** k osobním účtům. Není divu, že je těžké si je pamatovat.
      - 'Dobrá zpráva: k větší bezpečnosti stačí několik jednoduchých návyků. Dnes si vyzkoušíme:'
    points:
      - jaké heslo je dobré,
      - proč nemít stejné heslo všude,
      - jak funguje druhý zámek,
      - jak si přihlašování zjednodušit.
