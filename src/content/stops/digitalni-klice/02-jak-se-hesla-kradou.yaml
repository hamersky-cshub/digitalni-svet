# Zastávka workshopu. Každá položka v "screens" je jedna obrazovka (krok).
# Popis polí a typů aktivit najdete v README.md (sekce Úprava obsahu).

workshop: digitalni-klice
order: 2
title: Jak se hesla kradou
summary: Proč se běžná hesla uhodnou za pár vteřin.
icon: hook
lecturer:
  time: 20 minut
  goal: 'Pochopit, že hesla se většinou nehádají naslepo: vylákají se, zkoušejí z úniků nebo hádají ze seznamů běžných hesel.'
  discussion: Které heslo z ukázky by vás nenapadlo jako slabé?
  transition: Jak tedy vytvořit heslo, které odolá? Porovnejme si několik způsobů.
  tips:
    - Přesné časy u hesel 123456, heslo, Heslo1234 a maminka123 pocházejí z podkladů (Top 10 českých hesel); u ostatních hesel web uvádí jen přibližnou kategorii. Časy jsou orientační – závisí na vybavení útočníka a na tom, jak služba heslo ukládá.
    - 'Typy útoků podle podkladů: phishing, hrubá síla (brute force), password spraying, credential stuffing, keylogging.'
screens:
  - kind: vyklad
    title: Jak se k heslům dostávají
    text:
      - 'Útočníci obvykle nehádají heslo naslepo. Nejčastěji ho:'
    points:
      - 🎣 **Vylákají** – falešnou stránkou nebo zprávou (o tom bylo setkání Digitální obrana).
      - 📋 **Hádají z běžných hesel** – zkoušejí seznamy nejčastějších hesel, jako „123456“ nebo „heslo“.
      - 🔁 **Zkoušejí uniklá hesla jinde** – heslo z jednoho úniku vyzkoušejí u e-mailu, banky i obchodu.
      - 🖥️ **Zkoušejí všechny kombinace** – počítač zkouší „aaaa“, „aaab“… Krátká hesla tak padnou rychle.
    figures:
      - illustration: kradez-hesel
        alt: 'Čtyři obrázky: 1. na rybářském háčku visí klíč – heslo se vyláká, 2. seznam nejčastějších hesel 123456, heslo, qwerty a 111111 se zvýrazněným slovem heslo, 3. jeden klíč a šipky k e-mailu, bance a obchodu, 4. obrazovka počítače, který zkouší aaaa, aaab, aaac.'
        caption: '**Proti všem čtyřem pomáhá totéž:** dlouhé heslo, pro každý účet jiné, a ostražitost u zpráv.'
  - kind: aktivita
    title: Jak rychle se heslo uhodne?
    text:
      - Některá hesla patří mezi nejčastější v Česku, jiná jsou lepší. Odhadněte, jak dlouho by útočníkovi trvalo je uhodnout.
    activity:
      type: choices
      itemLabel: Heslo
      question: Jak dlouho by trvalo heslo uhodnout?
      options:
        - id: hned
          label: Okamžitě nebo za pár vteřin
        - id: minuty
          label: Do několika minut
        - id: hodiny
          label: Několik hodin
        - id: roky
          label: Roky a déle
      items:
        - text: „123456“
          recommended:
            - hned
          avoid:
            - roky
          explanation: '**Okamžitě.** Patří k nejpoužívanějším heslům na světě – útočníci ho zkoušejí jako první.'
        - text: „pampeliška-komín-sešit-žirafa“
          recommended:
            - roky
          explanation: '**Roky a déle.** Čtyři náhodná slova tvoří dlouhé heslo, které není v žádném seznamu. Přitom se dá zapamatovat – o tom na další zastávce.'
        - text: „heslo“
          recommended:
            - hned
          avoid:
            - roky
          explanation: '**Přibližně za 2 vteřiny.** Běžné slovo najdete v každém seznamu hesel.'
        - text: „Petr1975“
          recommended:
            - hned
            - minuty
          avoid:
            - roky
          explanation: '**Velmi rychle.** Jméno a rok narození útočníci zkoušejí mezi prvními – a často je najdou i na sociálních sítích.'
        - text: „Heslo1234“
          recommended:
            - minuty
          avoid:
            - roky
          explanation: '**Přibližně za minutu.** Velké písmeno na začátku a čísla na konci jsou tak obvyklé, že je útočníci zkoušejí automaticky.'
        - text: „qwertz“
          recommended:
            - hned
          avoid:
            - roky
          explanation: '**Okamžitě.** Jsou to písmena, která jdou na klávesnici za sebou. Takové „vzory“ jsou v seznamech hesel na předních místech.'
        - text: „maminka123“
          recommended:
            - hodiny
          avoid:
            - roky
          explanation: '**Přibližně za 6 hodin.** Zní to jako dlouho, ale pro počítač je to krátká doba. Slova z rodiny a čísla na konci se hádají mezi prvními.'
        - text: „Kj8#pQ2!“
          recommended:
            - hodiny
            - roky
          explanation: '**Záleží na službě – od hodin po roky.** Krátké heslo z náhodných znaků je lepší než slovo, ale těžko se pamatuje. Dlouhá heslová fráze je jistější i pohodlnější.'
        - text: „kocicka“
          recommended:
            - hned
          avoid:
            - roky
          explanation: '**Okamžitě.** Krátké běžné slovo – i bez diakritiky – je v každém seznamu hesel.'
        - text: „Praha2024!“
          recommended:
            - minuty
            - hodiny
          avoid:
            - roky
          explanation: '**Brzy.** Město, rok a vykřičník na konci jsou oblíbený vzor. Útočníci takové kombinace zkoušejí automaticky.'
  - kind: shrnuti
    title: Co z toho plyne
    activity:
      type: rules
      items:
        - title: Žádná jména, data narození ani běžná slova.
          text: Útočníci je zkoušejí jako první.
        - title: Čím delší heslo, tím lépe.
          text: Každý znak navíc hádání výrazně prodlouží.
        - title: Každý účet vlastní heslo.
          text: Uniklé heslo pak nikde jinde nepoužijí.
