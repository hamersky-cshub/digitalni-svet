# Workshop. Zastávky jsou ve složce src/content/stops/<název tohoto souboru>/.

title: Digitální klíče
subtitle: Jak ochránit své účty
cardText: Chraňte své účty s větší jistotou. Vyzkoušejte si heslovou frázi a najděte, kde se zapíná druhé ověření.
order: 3
icon: 🔑
outcomes:
  - Vytvoříte si dlouhou heslovou frázi.
  - Pochopíte, proč mít pro každý účet jiné heslo.
  - Budete vědět, k čemu je správce hesel a přístupový klíč.
  - Najdete, kde se zapíná dvoufázové ověření.
annotation:
  - E-mail, internetové bankovnictví nebo sociální sítě dnes používá téměř každý. Přístup chrání hesla, která jsou často jedinou překážkou mezi osobními údaji a útočníky.
  - Několik jednoduchých návyků ale může bezpečnost výrazně zvýšit.
  - Workshop vysvětluje, jak vytvářet bezpečná hesla, proč nepoužívat stejné heslo všude, jak funguje dvoufázové ověření a jak si přihlašování zjednodušit.
  - Krátce si ukážeme i novější způsob přihlašování otiskem prstu nebo obličejem.
takeaway:
  title: Co mám hotovo
  checklist:
    - E-mail má vlastní dlouhé heslo, které nepoužívám nikde jinde.
    - Dvoufázové ověření v e-mailu.
    - Dvoufázové ověření v bance a na sociální síti.
    - Správce hesel nebo přístupové klíče – zeptám se blízkých.
  warning: Hesla sem nikdy nepište. Tahák může najít i někdo jiný.
