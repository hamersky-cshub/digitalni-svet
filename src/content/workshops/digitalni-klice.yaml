# Workshop. Zastávky jsou ve složce src/content/stops/<název tohoto souboru>/.

title: Digitální klíče
subtitle: Jak ochránit své účty
cardText: Ukážeme si, jak bezpečně pracovat s hesly a dalšími způsoby přihlašování.
order: 3
icon: 🔑
annotation:
  - E-mail, internetové bankovnictví nebo sociální sítě dnes používá téměř každý. Přístup chrání hesla, která jsou často jedinou překážkou mezi osobními údaji a útočníky.
  - Několik jednoduchých návyků ale může bezpečnost výrazně zvýšit.
  - Workshop vysvětluje, jak vytvářet bezpečná hesla, proč nepoužívat stejné heslo všude, jak funguje dvoufázové ověřování a jak si přihlašování zjednodušit.
  - Krátce si ukážeme i novější způsob přihlašování otiskem prstu nebo obličejem.
